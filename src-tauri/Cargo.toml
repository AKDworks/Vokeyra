[package]
name = "vokeyra"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Private, local speech to text for your desktop"
authors = ["AKDworks"]
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
dunce = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
